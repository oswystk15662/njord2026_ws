name: ROS 2 CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install static-check dependencies
        run: python -m pip install PyYAML

      - name: Check diff whitespace
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Validate changed structured files
        run: python .github/scripts/check_changed_files.py --base "origin/${{ github.base_ref }}"

  core-simulation-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install package dependencies
        run: |
          rosdep update
          rosdep install --from-paths \
            src/sim/dutyed_tf_pub_with_disturbance \
            src/sim/operation_validator \
            src/sim/task1_sim \
            src/sim/task2_sim \
            src/sim/task3_sim \
            src/simple_sim \
            --ignore-src --rosdistro humble -r -y

      - name: Build core simulation packages
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct+ --packages-select \
            dutyed_tf_pub_with_disturbance \
            operation_validator \
            task1_sim \
            task2_sim \
            task3_sim \
            simple_sim

      - name: Test core simulation packages
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+ --packages-select \
            dutyed_tf_pub_with_disturbance \
            operation_validator \
            task1_sim \
            task2_sim \
            task3_sim \
            simple_sim
          colcon test-result --verbose
