### Global EKF (map -> odom) ###
# ローカルEKFの結果 (odometry/filtered/local) をGlobal EKFに入力
# navsat_transform_nodeから得たGPS位置情報を融合してmap -> odomを計算
ekf_filter_node_global:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: false  # SimNode publishes map→odom (static identity); EKF only outputs odometry topic
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map  # Global は map 座標系が基準
    print_diagnostics: true

    # Local EKF の出力 (既に融合されたオドメトリ)
    odom0: odometry/filtered/local
    odom0_config: [true,  true,  true,   # X, Y, Z
                   true,  true,  true,   # Roll, Pitch, Yaw
                   false, false, false,  # Velocity は不使用
                   false, false, false,  # Angular velocity は不使用
                   false, false, false]  # Acceleration は不使用
    odom0_differential: true   # Use velocity increments only — odom is in odom frame, not map frame
    odom0_relative: false

    # IMU (WIT Motion - 絶対方位を提供)
    imu0: /wit/imu
    imu0_config: [false, false, false,   # Position は不使用
                  true,  true,  true,    # Orientation (方位)
                  false, false, false,   # Velocity は不使用
                  true,  true,  true,    # Angular velocity
                  true,  true,  true]    # Acceleration (重力補正用)
    imu0_differential: false
    imu0_relative: false  # Global では絶対方位 (Heading) を信じる
    imu0_remove_gravitational_acceleration: true

    # GPS (navsat_transform_node からの出力)
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,  # X, Y (Z は信頼しない)
                   false, false, false,  # Orientation は不使用
                   false, false, false,  # Velocity は不使用
                   false, false, false,  # Angular velocity は不使用
                   false, false, false]  # Acceleration は不使用
    odom1_differential: false
    odom1_relative: false