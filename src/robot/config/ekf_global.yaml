### Global EKF (map -> odom) ###
# The local EKF estimate and GPS odometry are fused into a globally corrected
# odometry topic. GLIM remains the TF authority on the real robot.
ekf_filter_node_global:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map
    print_diagnostics: true

    # Local EKF output. Differential mode avoids treating an odom-frame pose
    # as an absolute map-frame pose.
    odom0: odometry/filtered/local
    odom0_config: [true,  true,  true,
                   true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: true
    odom0_relative: false

    # GPS odometry from navsat_transform_node
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
