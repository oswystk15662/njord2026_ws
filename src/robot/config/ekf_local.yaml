### Local EKF (odom -> base_link estimate) ###
# GLIM odometry alone is fused into a filtered odometry topic. GLIM remains
# the TF authority on the real robot.
ekf_filter_node_local:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    print_diagnostics: true

    # GLIM LiDAR odometry
    # odom0: /odom
    # odom0_config: [true,  true,  true,
    #                true,  true,  true,
    #                false, false, false,
    #                false, false, false,
    #                false, false, false]
    # odom0_differential: false

    imu0: /lidar/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true]
    
    # imu1: /imu/data
    # imu1_config: [false, false, false,
    #               false, false, false,
    #               true,  true,  true,
    #               false, false, false,
    #               true,  true,  true]
