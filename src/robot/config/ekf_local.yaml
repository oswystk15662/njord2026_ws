### Local EKF (odom -> base_link estimate) ###
# GLIM odometry and the WIT Motion IMU are fused into a filtered odometry
# topic. GLIM remains the TF authority on the real robot.
ekf_filter_node_local:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    print_diagnostics: true

    # GLIM LiDAR odometry
    odom0: /odom
    odom0_config: [true,  true,  true,
                   true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    # WIT Motion IMU: use relative orientation changes in the local filter
    imu0: /wit/imu
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
