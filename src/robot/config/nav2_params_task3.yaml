# nav2_params_task3.yaml
# Nav2 parameters tuned for Task 3 (docking) simulation
# Key differences from default nav2_params.yaml:
#   - global_costmap: fixed 80x80m static map centered at origin
#     + field boundary layer (/field_boundary_costmap) → outside is LETHAL
#     + buoy costmap layer (/buoy_costmap) → buoy obstacles
#   - local_costmap: rolling 20x20m window, buoy costmap layer added
#   - obstacle_layer: /pointcloud from orchestrator (PointCloud2)

amcl:
  ros__parameters:
    enabled: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered/global
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "/home/osw/njord2026_ws/install/robot/share/robot/config/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/home/osw/njord2026_ws/install/robot/share/robot/config/navigate_through_poses_w_replanning_and_recovery.xml"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.8
      lookahead_dist: 1.5
      min_lookahead_dist: 0.5
      max_lookahead_dist: 3.0
      lookahead_time: 1.5
      rotate_to_heading_min_angle: 0.785
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.5
      max_angular_accel: 1.5
      max_linear_accel: 1.5

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.8
      yaw_goal_tolerance: 0.5

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      minimum_turning_radius: 1.5    # ASV hull 2.0m: realistic turning radius
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 6.0  # larger → finds goal with fewer expansions

# ─── LOCAL COSTMAP ───────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.1
      robot_radius: 1.4
      # obstacle_layer uses /pointcloud (PointCloud2 from orchestrator)
      # buoy_costmap_layer injects pre-inflated buoy obstacles from BuoyObstaclePublisher
      plugins: ["obstacle_layer", "buoy_costmap_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: pointcloud
        pointcloud:
          topic: /pointcloud
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 20.0
          obstacle_max_range: 18.0

      buoy_costmap_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: False
        map_topic: "/buoy_costmap"
        subscribe_to_updates: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0

# ─── GLOBAL COSTMAP ──────────────────────────────────────────────────────────
# Rolling window: follows the robot, keeps search space manageable.
# Buoy obstacles come from /buoy_costmap (StaticLayer, updated at 5 Hz).
# Field boundary is NOT enforced here — the 40m field constraint is
# handled by the waypoint sequence staying within the field.
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      robot_radius: 1.4
      resolution: 0.1
      rolling_window: true
      width: 50           # 50 m rolling window — covers the full 40 m task3 field
      height: 50
      track_unknown_space: false

      plugins: ["buoy_costmap_layer", "inflation_layer"]

      buoy_costmap_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: False
        map_topic: "/buoy_costmap"
        subscribe_to_updates: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 1.5

# ─── MISC ────────────────────────────────────────────────────────────────────
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # ASV cannot spin in place — only wait and backup as recovery behaviors
    behavior_plugins: ["backup", "wait", "drive_on_heading"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 0.0, 2.0]
    min_velocity: [-1.0, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["natural_cubic_spline"]
    natural_cubic_spline:
      plugin: "natural_cubic_spline::NaturalCubicSplineSmoother"
      path_point_spacing: 0.05
      control_point_spacing: 0.5
