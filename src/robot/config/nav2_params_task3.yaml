# nav2_params_task3.yaml
# Nav2 parameters tuned for Task 3 (docking) simulation
# Robot: X-configuration 4-thruster omni-directional ASV (HOLONOMIC)
#
# Key design decisions for holonomic robot:
#   - Planner: ThetaStarPlanner (holonomic, generates straight-line paths)
#     → SmacPlannerHybrid/DUBIN was wrong: Dubins curves are for car-like robots.
#       They force "rotate then drive" behavior which wastes time for omni robots.
#   - Controller: RegulatedPurePursuitController with rotate_to_heading DISABLED
#     → With rotate_to_heading_min_angle removed (use_rotate_to_heading=false),
#       RPP drives toward the lookahead point without pure-spin phases.
#   - velocity_smoother: y-axis velocity enabled (was incorrectly set to 0.0)
#     → Omni robots produce linear.y; clamping it to 0
#       discards all sway commands before they reach the thrusters.

amcl:
  ros__parameters:
    enabled: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    # Default real-vessel profile: UM982 feedback only.  A future multi-sensor
    # profile may restore map/global-EKF localisation.
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odometry/filtered/local
    bt_loop_duration: 10
    default_server_timeout: 20
    # Rewritten by robot/launch/nav2.launch.py using the installed package share path.
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 30.0

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # ── 速度設定 ────────────────────────────────────────────────────────
      desired_linear_vel: 0.5          # 最大直進速度 [m/s]
      min_approach_linear_velocity: 0.1  # ゴール接近時の最低速度
      approach_velocity_scaling_dist: 6.0  # ここから減速開始 [m] (5m行き過ぎ対策)

      # ── ルックアヘッド設定 ─────────────────────────────────────────────
      # lookahead_distを大きくすると、ThetaStarの格子パスの急な方向変換を
      # 滑らかに先読みし、くるくる回転を抑制できる
      lookahead_dist: 3.0
      min_lookahead_dist: 1.5
      max_lookahead_dist: 8.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      # ── 回転設定 ───────────────────────────────────────────────────────
      # オムニロボット: 先に回転してから進む動作(rotate_to_heading)は不要
      # use_rotate_to_heading=falseではproportional_gainは使われない
      # (angular.z = linear_vel * curvatureで計算される)
      use_rotate_to_heading: false
      max_angular_accel: 1.0           # 角加速度リミット [rad/s²]

      # ── 規制 ──────────────────────────────────────────────────────────
      use_cost_regulated_linear_velocity_scaling: false  # コストマップ障害物での減速(今は無効)
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1

      transform_tolerance: 0.3
      max_linear_accel: 0.5

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.8
      yaw_goal_tolerance: 0.5

# ─── PLANNER ─────────────────────────────────────────────────────────────────
# ThetaStarPlanner: holonomic planner that generates straight-line paths
# between waypoints. Unlike SmacPlannerHybrid/DUBIN (which produces Dubins
# curves for car-like robots), ThetaStar treats the robot as holonomic and
# allows movement in any direction — ideal for an omni-directional ASV.
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      how_many_corners: 8        # 8-connected grid (diagonal movement allowed)
      w_euc_cost: 1.0            # Euclidean distance weight
      w_traversal_cost: 2.0      # Costmap traversal weight
      w_heuristic_cost: 1.0      # Heuristic weight

# ─── LOCAL COSTMAP ───────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.1
      robot_radius: 0.35
      plugins: ["obstacle_layer", "buoy_costmap_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: pointcloud
        pointcloud:
          topic: /pointcloud
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 20.0
          obstacle_max_range: 18.0

      buoy_costmap_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: False
        map_topic: "/buoy_costmap"
        subscribe_to_updates: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5

# ─── GLOBAL COSTMAP ──────────────────────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      robot_radius: 0.35
      resolution: 0.1
      rolling_window: false
      width: 50
      height: 50
      origin_x: -25.0
      origin_y: -25.0
      track_unknown_space: false

      plugins: ["field_boundary_layer", "buoy_costmap_layer", "inflation_layer"]

      field_boundary_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: "/field_boundary_costmap"
        subscribe_to_updates: False

      buoy_costmap_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: False
        map_topic: "/buoy_costmap"
        subscribe_to_updates: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.5

# ─── MISC ────────────────────────────────────────────────────────────────────
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "wait", "drive_on_heading"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    use_sim_time: false

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_nav"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/pointcloud"
      min_height: -0.5
      max_height: 2.0
      use_global_height: False
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

# CRITICAL: y-axis (sway) must NOT be clamped to 0 for an omni robot.
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5,  0.5,  1.0]   # reduced to match desired_linear_vel
    min_velocity: [-0.5, -0.5, -1.0]
    max_accel:    [0.5,  0.5,  1.0]   # gentle accel to prevent overshoot
    max_decel:    [-0.5, -0.5, -1.0]
    odom_topic: "odom"

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["natural_cubic_spline"]
    natural_cubic_spline:
      plugin: "natural_cubic_spline::NaturalCubicSplineSmoother"
      path_point_spacing: 0.05
      control_point_spacing: 0.5
