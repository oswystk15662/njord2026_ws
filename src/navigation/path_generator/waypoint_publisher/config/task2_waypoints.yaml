# Task 2: Collision Avoidance
# Enter every waypoint as Excel-copyable WGS84 DMS latitude/longitude. Mission Manager and Task2
# MPPI project these values through /fromLL at run time; coordinate modes and
# x/y waypoint input are intentionally unsupported.

task2_config:
  frame_id: "map"
  publish_rate_hz: 2.0
  # Provisional Norway layout for visualization/integration. GPS 5 is Task
  # 1's GPS 1; GPS 6 is approximately 46 m south-south-west of GPS 5
  # (bearing 202.5 degrees). Replace with surveyed values before operation.
  waypoints:
    - id: 5
      latitude: 63.4408000000
      longitude: 10.4233194444
      yaw: -1.9634954085
      type: "start"
      name: "GPS 5 - Start"
      tolerance_m: 2.0

    - id: 6
      latitude: 63.4404230000
      longitude: 10.4229704000
      yaw: -1.9634954085
      type: "goal"
      name: "GPS 6 - Goal"
      tolerance_m: 2.0

  constraints:
    speed_knots: 2.0
    speed_requirement: "accelerate_immediately"
    obstacle_avoidance: true
    colreg_compliance: true
    collision_angles_deg: [-100, 100]
    attempts_per_scenario: 2
