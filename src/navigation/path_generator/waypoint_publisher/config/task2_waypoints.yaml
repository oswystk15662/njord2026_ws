# Task 2: Collision Avoidance
# Enter every waypoint as Excel-copyable WGS84 DMS latitude/longitude. Mission Manager and Task2
# MPPI project these values through /fromLL at run time; coordinate modes and
# x/y waypoint input are intentionally unsupported.

task2_config:
  frame_id: "map"
  publish_rate_hz: 2.0
  # Provisional Norway layout for visualization/integration. GPS 6 remains
  # approximately 46 m north-east of GPS 5; replace with surveyed values
  # before operation.
  waypoints:
    - id: 5
      latitude: 63.4417000000
      longitude: 10.4230000000
      yaw: 0.6559
      type: "start"
      name: "GPS 5 - Start"
      tolerance_m: 2.0

    - id: 6
      latitude: 63.4419500000
      longitude: 10.4237200000
      yaw: 0.6559
      type: "goal"
      name: "GPS 6 - Goal"
      tolerance_m: 2.0

  constraints:
    speed_knots: 2.0
    speed_requirement: "accelerate_immediately"
    obstacle_avoidance: true
    colreg_compliance: true
    collision_angles_deg: [-100, 100]
    attempts_per_scenario: 2
