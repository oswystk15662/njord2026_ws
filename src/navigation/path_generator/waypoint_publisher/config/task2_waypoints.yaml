# Task 2: Collision Avoidance
# test07089 pool experiment (issue #47): straight run along the pool diagonal
# C -> A, shared diagonal with Task 1.2 (GPS3/GPS4 in task1_waypoints.yaml).
# Course length ~46.16 m, heading -0.2027 rad (constant along the diagonal).

task2_config:
  frame_id: "map"
  publish_rate_hz: 2.0
  origin:
    latitude: 35.6675575459
    longitude: 139.7933614800
    name: "GPS 5 - Start (pool corner C)"
  gps_points:
    - id: 5
      latitude: 35.6675575459
      longitude: 139.7933614800
      name: "GPS 5 - Start (corner C)"
    - id: 6
      latitude: 35.6674742121
      longitude: 139.7938614790
      name: "GPS 6 - Goal (corner A)"

  waypoints:
    - id: 5
      x: 0.0
      y: 0.0
      yaw: -0.2027
      type: "start"
      name: "GPS 5 - Start"
      tolerance_m: 2.0

    - id: "gate_1"
      x: 15.0730
      y: -3.0923
      yaw: -0.2027
      type: "gate"
      name: "Entry Gate"
      gate_pair: ["red", "green"]
      spacing_m: 10.0
      tolerance_m: 2.0

    - id: "gate_2"
      x: 30.1460
      y: -6.1847
      yaw: -0.2027
      type: "gate"
      name: "Exit Gate"
      gate_pair: ["red", "green"]
      spacing_m: 10.0
      tolerance_m: 2.0

    - id: 6
      x: 45.2190
      y: -9.2770
      yaw: -0.2027
      type: "goal"
      name: "GPS 6 - Goal"
      tolerance_m: 2.0

  constraints:
    speed_knots: 2.0
    speed_requirement: "accelerate_immediately"
    obstacle_avoidance: true
    colreg_compliance: true
    collision_angles_deg: [-100, 100]
    attempts_per_scenario: 2
