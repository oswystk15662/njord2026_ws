# Task 2: Collision Avoidance
# Enter each WGS84 latitude/longitude as decimal degrees or DMS. Mission Manager
# and Task2 MPPI project the values through /fromLL at run time.

task2_config:
  frame_id: "odom"
  publish_rate_hz: 2.0
  # WP2 lies south-west of WP1; yaw follows the WP1 -> WP2 route heading.
  waypoints:
    - id: 5
      latitude: 63.4422075
      longitude: 10.4246263
      yaw: -1.865
      type: "start"
      name: "GPS 5 - Start"
      tolerance_m: 2.0

    - id: 6
      latitude: 63.4419401
      longitude: 10.4244456
      yaw: -1.865
      type: "goal"
      name: "GPS 6 - Goal"
      tolerance_m: 2.0

  constraints:
    speed_knots: 2.0
    speed_requirement: "accelerate_immediately"
    obstacle_avoidance: true
    colreg_compliance: true
    collision_angles_deg: [-100, 100]
    attempts_per_scenario: 2
