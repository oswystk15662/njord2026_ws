# Task 2: Collision Avoidance
# Enter every waypoint as Excel-copyable WGS84 DMS latitude/longitude. Mission Manager and Task2
# MPPI project these values through /fromLL at run time; coordinate modes and
# x/y waypoint input are intentionally unsupported.

task2_config:
  frame_id: "map"
  publish_rate_hz: 2.0
  # Paste values such as `63°26′26.89″ N` directly from the survey sheet.
  waypoints:
    - id: 5
      latitude: "34°32′44.40″ N"
      longitude: "135°30′25.40″ E"
      yaw: 0.6627
      type: "start"
      name: "GPS 5 - Start"
      tolerance_m: 2.0

    - id: "gate_1"
      latitude: "34°32′44.70″ N"
      longitude: "135°30′25.87″ E"
      yaw: 0.6627
      type: "gate"
      name: "Entry Gate"
      gate_pair: ["red", "green"]
      spacing_m: 10.0
      tolerance_m: 2.0

    - id: "gate_2"
      latitude: "34°32′45.00″ N"
      longitude: "135°30′26.33″ E"
      yaw: 0.6627
      type: "gate"
      name: "Exit Gate"
      gate_pair: ["red", "green"]
      spacing_m: 10.0
      tolerance_m: 2.0

    - id: 6
      latitude: "34°32′45.30″ N"
      longitude: "135°30′26.80″ E"
      yaw: 0.6627
      type: "goal"
      name: "GPS 6 - Goal"
      tolerance_m: 2.0

  constraints:
    speed_knots: 2.0
    speed_requirement: "accelerate_immediately"
    obstacle_avoidance: true
    colreg_compliance: true
    collision_angles_deg: [-100, 100]
    attempts_per_scenario: 2
