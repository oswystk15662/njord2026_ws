# Task 2: Collision Avoidance
# Enter each WGS84 latitude/longitude as decimal degrees or DMS. Mission Manager
# and Task2 MPPI project the values through /fromLL at run time.

task2_config:
  frame_id: "odom"
  publish_rate_hz: 2.0
  # GPS 6 is approximately 24 m west-north-west of GPS 5.
  waypoints:
    - id: 5
      latitude: 63.44244406812208
      longitude: 10.425838228322759
      yaw: -1.9634954085
      type: "start"
      name: "GPS 5 - Start"
      tolerance_m: 2.0

    - id: 6
      latitude: 63.44248983175509
      longitude: 10.425370944290792
      yaw: -1.9634954085
      type: "goal"
      name: "GPS 6 - Goal"
      tolerance_m: 2.0

  constraints:
    speed_knots: 2.0
    speed_requirement: "accelerate_immediately"
    obstacle_avoidance: true
    colreg_compliance: true
    collision_angles_deg: [-100, 100]
    attempts_per_scenario: 2
