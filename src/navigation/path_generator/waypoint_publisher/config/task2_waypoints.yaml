# Task 2: Collision Avoidance
# Enter every waypoint as WGS84 latitude/longitude. Mission Manager and Task2
# MPPI project these values through /fromLL at run time; coordinate modes and
# x/y waypoint input are intentionally unsupported.

task2_config:
  frame_id: "map"
  publish_rate_hz: 2.0
  # Replace only latitude/longitude below with surveyed course values.
  waypoints:
    - id: 5
      latitude: 34.5456666667
      longitude: 135.5070555556
      yaw: 0.6627
      type: "start"
      name: "GPS 5 - Start"
      tolerance_m: 2.0

    - id: "gate_1"
      latitude: 34.5457500000
      longitude: 135.5071851354
      yaw: 0.6627
      type: "gate"
      name: "Entry Gate"
      gate_pair: ["red", "green"]
      spacing_m: 10.0
      tolerance_m: 2.0

    - id: "gate_2"
      latitude: 34.5458333333
      longitude: 135.5073147142
      yaw: 0.6627
      type: "gate"
      name: "Exit Gate"
      gate_pair: ["red", "green"]
      spacing_m: 10.0
      tolerance_m: 2.0

    - id: 6
      latitude: 34.5459166689
      longitude: 135.5074442940
      yaw: 0.6627
      type: "goal"
      name: "GPS 6 - Goal"
      tolerance_m: 2.0

  constraints:
    speed_knots: 2.0
    speed_requirement: "accelerate_immediately"
    obstacle_avoidance: true
    colreg_compliance: true
    collision_angles_deg: [-100, 100]
    attempts_per_scenario: 2
