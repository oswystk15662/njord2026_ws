# Task 1: Maneuvering and Path Finding
# The Task1 simulation coordinates below use the same rotated local frame as
# task1_sim/config/task1_params.yaml.  In particular, x points along the
# course and y is the lateral axis.  Do not publish the raw ENU follow-test
# points here: their unrotated end point (35.66, 27.83) is outside the Task1
# simulated course (y = -40 .. 15).
#
# Legacy pool rectangle reference points for Task 1.2:
#   A: 35°40'03.0"N 139°47'37.9"E
#   B: 35°40'03.9"N 139°47'36.8"E
#   C: 35°40'03.3"N 139°47'36.1"E
#
# GPS points 1 and 2 define the start and finish of today's course.  The route
# advances from GPS 1 to GPS 2 while tracing two complete sine-wave periods
# with a 3 m lateral amplitude.  Each period is sampled at eight segments.

task1_config:
  frame_id: "map"
  publish_rate_hz: 2.0
  origin:
    latitude: 34.5456666667
    longitude: 135.5070555556
    name: "GPS 1 - Slalom Start"
  gps_points:
    - id: 1
      latitude: 34.5456666667
      longitude: 135.5070555556
      dms: '34°32''44.4"N 135°30''25.4"E'
      name: "GPS 1 - Slalom Start"
    - id: 2
      latitude: 34.5459166667
      longitude: 135.5074444444
      dms: '34°32''45.3"N 135°30''26.8"E'
      name: "GPS 2 - Slalom Finish"

    # --- Task 1.2 (cardinal marker recognition, issue #46) ---
    # Reference points only; no TaskType/route exists yet for task1-2.
    # Diagonal A<->C of the legacy pool rectangle; not used by this Task 1 route.
    - id: 3
      latitude: 35.6675575459
      longitude: 139.7933614800
      name: "GPS 3 - Task1.2 diagonal start (corner C)"
    - id: 4
      latitude: 35.6674742121
      longitude: 139.7938614790
      name: "GPS 4 - Task1.2 diagonal goal (corner A)"

  # This sequence is expressed in the simulation-local, rotated frame. It
  # contains every required point: GPS 1 -> 1.1--1.10 -> GPS 2 -> GPS 3 ->
  # 3.1--3.3 -> GPS 4.  The previous route began at GPS 2 and consequently
  # never sent the ten intermediate GPS 1--2 waypoints to Nav2.
  waypoints:
    - id: 1
      x: 0.0000
      y: 0.0000
      yaw: 0.4636
      type: "start"
      name: "GPS 1 - Slalom Start"
      tolerance_m: 2.0

    - id: 2
      x: 10.0000
      y: 5.0000
      yaw: -1.0304
      type: "waypoint"
      name: "GPS 1.1"
      tolerance_m: 2.0

    - id: 3
      x: 13.0000
      y: 0.0000
      yaw: -1.0304
      type: "waypoint"
      name: "GPS 1.2"
      tolerance_m: 2.0

    - id: 4
      x: 16.0000
      y: -5.0000
      yaw: 0.9828
      type: "waypoint"
      name: "GPS 1.3"
      tolerance_m: 2.0

    - id: 5
      x: 19.0000
      y: -0.5000
      yaw: 1.1384
      type: "waypoint"
      name: "GPS 1.4"
      tolerance_m: 2.0

    - id: 6
      x: 22.0000
      y: 6.0000
      yaw: -1.1071
      type: "waypoint"
      name: "GPS 1.5"
      tolerance_m: 2.0

    - id: 7
      x: 25.0000
      y: 0.0000
      yaw: -1.0304
      type: "waypoint"
      name: "GPS 1.6"
      tolerance_m: 2.0

    - id: 8
      x: 28.0000
      y: -5.0000
      yaw: 0.9273
      type: "waypoint"
      name: "GPS 1.7"
      tolerance_m: 2.0

    - id: 9
      x: 31.0000
      y: -1.0000
      yaw: 0.7854
      type: "waypoint"
      name: "GPS 1.8"
      tolerance_m: 2.0

    - id: 10
      x: 34.0000
      y: 2.0000
      yaw: -0.3218
      type: "waypoint"
      name: "GPS 1.9"
      tolerance_m: 2.0

    - id: 11
      x: 40.0000
      y: 0.0000
      yaw: 0.0000
      type: "waypoint"
      name: "GPS 1.10"
      tolerance_m: 2.0

    - id: 12
      x: 50.0000
      y: 0.0000
      yaw: -1.5708
      type: "gps"
