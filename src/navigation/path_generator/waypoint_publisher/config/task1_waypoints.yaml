    - {id: 7, competition_id: "2", latitude: 63.4405138889, longitude: 10.4230583333, yaw: -0.6642, type: "transit", name: "GPS 2", tolerance_m: 2.0}
    - {id: 8, competition_id: "3", latitude: 63.4404166667, longitude: 10.4233361111, yaw: 1.1111, type: "start", name: "GPS 3", tolerance_m: 2.0}
