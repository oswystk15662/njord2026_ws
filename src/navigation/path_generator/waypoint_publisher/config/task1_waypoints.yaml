# Task 1 surveyed route from "GPS points for tasks.xlsx", sheet
# "Monday Maneuvering and path fin".  Excel serial-number rows are sequential
# intermediate waypoints: 1.1--1.5 and 3.1--3.4 respectively.

task1_config:
  frame_id: "map"
  publish_rate_hz: 2.0
  waypoints: &task1_waypoints
    - {id: 1, competition_id: "1", latitude: 63.4408027778, longitude: 10.4233944444, yaw: -3.0800, type: "start", name: "GPS 1", tolerance_m: 2.0}
    - {id: 2, competition_id: "1.1", latitude: 63.4408000000, longitude: 10.4232944444, yaw: -1.2564, type: "waypoint", name: "GPS 1.1", tolerance_m: 2.0}
