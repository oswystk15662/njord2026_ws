# Task 1: Maneuvering and Path Finding
# The Task1 simulation coordinates below use the same rotated local frame as
# task1_sim/config/task1_params.yaml.  In particular, x points along the
# course and y is the lateral axis.  Do not publish the raw ENU follow-test
# points here: their unrotated end point (35.66, 27.83) is outside the Task1
# simulated course (y = -40 .. 15).
#
# `task1_config` is the official NJORD 2026 Task1 competition scenario: a
# Cartesian sim approximation of the "4 GPS point -> cardinal marker slalom"
# course (see src/sim/task1_sim/README.md and task1_sim/config/task1_params.yaml,
# which is the source of truth for the matching marker geometry). The boat
# runs (50,-25) -> (24,-35) -> (15,-15) -> (8,-35) -> (0,-25), weaving past
# three cardinal marks at y=-25 (S, N, S) that force the alternating-side
# passage.
#
# `task1_follow_config` is the original two-period sine-wave follow-test
# route (issue predates the cardinal-marker slalom); kept for regression
# testing of plain waypoint following, not the competition scenario.
#
# Legacy pool rectangle reference points for Task 1.2:
#   A: 35°40'03.0"N 139°47'37.9"E
#   B: 35°40'03.9"N 139°47'36.8"E
#   C: 35°40'03.3"N 139°47'36.1"E

task1_config:
  frame_id: "map"
  # Mission Manager (`njord-task start task1 --auto`) の座標指定方法:
  #
  # 1) origin_relative_xy（実機の推奨）:
  #    origin に基準点GPS（例: GPS1）を入れる。waypoints の x,y は基準点から
  #    東を+x、北を+y とするメートル値。origin は /fromLL で実行時mapへ投影される。
  #
  # 2) geodetic:
  #    下の各 waypoint から x,y を削除し、代わりに latitude, longitude を全点へ書く。
  #    例: {id: 2, competition_id: "1.1", latitude: 34.5, longitude: 135.5, yaw: 0.0}
  #
  # 3) map_xy（旧互換）:
  #    x,y を既にmap座標として使う。origin/GPS値は走行位置に使わない。
  #
  # GPS3/GPS4の competition_id はどのモードでも残すこと。GPS3通過後の仮想壁
  # 有効化と、GPS3→GPS4の方位算出に使う。
  coordinate_mode: "origin_relative_xy"
  publish_rate_hz: 2.0
  origin:
    latitude: 34.5456666667
    longitude: 135.5070555556
    name: "GPS 1 - Slalom Start"
  # Full Task1 route: task1-1's maneuvering waypoints, followed by the
  # cardinal-marker S/N/S slalom. This order matches task1_sim's evaluation
  # sequence (waypoint1_xy, GPS checkpoints, then waypoint2_xy).
  waypoints:
    - id: 1
      competition_id: "1"
      x: 0.0000
      y: 0.0000
      yaw: 0.4636
      type: "start"
      name: "GPS 1"
      tolerance_m: 2.0

    - id: 2
      competition_id: "1.1"
      x: 10.0000
      y: 5.0000
      yaw: -1.0304
      type: "waypoint"
      name: "GPS 1.1"
      tolerance_m: 2.0

    - id: 3
      competition_id: "1.2"
      x: 13.0000
      y: 0.0000
      yaw: -1.0304
      type: "waypoint"
      name: "GPS 1.2"
      tolerance_m: 2.0

    - id: 4
      competition_id: "1.3"
      x: 16.0000
      y: -5.0000
      yaw: 0.9828
      type: "waypoint"
      name: "GPS 1.3"
      tolerance_m: 2.0

    - id: 5
      competition_id: "1.4"
      x: 19.0000
      y: -0.5000
      yaw: 1.1384
      type: "waypoint"
      name: "GPS 1.4"
      tolerance_m: 2.0

    - id: 6
      competition_id: "1.5"
      x: 22.0000
      y: 6.0000
      yaw: -1.1071
      type: "waypoint"
      name: "GPS 1.5"
      tolerance_m: 2.0

    - id: 7
      competition_id: "1.6"
      x: 25.0000
      y: 0.0000
      yaw: -1.0304
      type: "waypoint"
      name: "GPS 1.6"
      tolerance_m: 2.0

    - id: 8
      competition_id: "1.7"
      x: 28.0000
      y: -5.0000
      yaw: 0.9273
      type: "waypoint"
      name: "GPS 1.7"
      tolerance_m: 2.0

    - id: 9
      competition_id: "1.8"
      x: 31.0000
      y: -1.0000
      yaw: 0.7854
      type: "waypoint"
      name: "GPS 1.8"
      tolerance_m: 2.0

    - id: 10
      competition_id: "1.9"
      x: 34.0000
      y: 2.0000
      yaw: -0.3218
      type: "waypoint"
      name: "GPS 1.9"
      tolerance_m: 2.0

    - id: 11
      competition_id: "1.10"
      x: 40.0000
      y: 0.0000
      yaw: 0.0000
      type: "waypoint"
      name: "GPS 1.10"
      tolerance_m: 2.0

    - id: 12
      competition_id: "2"
      x: 50.0000
      y: 0.0000
      yaw: -1.5708
      type: "transit"
      name: "GPS 2"
      tolerance_m: 2.0

    - id: 13
      competition_id: "3"
      x: 50.0000
      y: -25.0000
      yaw: -2.7744
      type: "start"
      name: "GPS 3"
      tolerance_m: 2.0

    - id: 14
      competition_id: "3.1"
      x: 24.0000
      y: -35.0000
      yaw: 1.9937
      type: "turn"
      name: "GPS 3.1"
      tolerance_m: 2.0

    - id: 15
      competition_id: "3.2"
      x: 15.0000
      y: -15.0000
      yaw: -1.9075
      type: "turn"
      name: "GPS 3.2"
      tolerance_m: 2.0

    - id: 16
      competition_id: "3.3"
      x: 8.0000
      y: -35.0000
      yaw: 2.2455
      type: "turn"
      name: "GPS 3.3"
      tolerance_m: 2.0

    - id: 17
      competition_id: "4"
      x: 0.0000
      y: -25.0000
      yaw: 2.2455
      type: "goal"
      name: "GPS 4"
      tolerance_m: 2.0

  constraints:
    follow_test: false
    route_pattern: "task1_1_then_cardinal_slalom"
    cardinal_marker_detection: true
    vision_halfway: false

