# Task 1: Maneuvering and Path Finding
# The Task1 simulation coordinates below use the same rotated local frame as
# task1_sim/config/task1_params.yaml.  In particular, x points along the
# course and y is the lateral axis.  Do not publish the raw ENU follow-test
# points here: their unrotated end point (35.66, 27.83) is outside the Task1
# simulated course (y = -40 .. 15).
#
# `task1_config` is the official NJORD 2026 Task1 competition scenario: a
# Cartesian sim approximation of the "4 GPS point -> cardinal marker slalom"
# course (see src/sim/task1_sim/README.md and task1_sim/config/task1_params.yaml,
# which is the source of truth for the matching marker geometry). The boat
# runs (50,-25) -> (24,-35) -> (15,-15) -> (8,-35) -> (0,-25), weaving past
# three cardinal marks at y=-25 (S, N, S) that force the alternating-side
# passage.
#
# `task1_follow_config` is the original two-period sine-wave follow-test
# route (issue predates the cardinal-marker slalom); kept for regression
# testing of plain waypoint following, not the competition scenario.
#
# Legacy pool rectangle reference points for Task 1.2:
#   A: 35°40'03.0"N 139°47'37.9"E
#   B: 35°40'03.9"N 139°47'36.8"E
#   C: 35°40'03.3"N 139°47'36.1"E

task1_config:
  frame_id: "map"
  publish_rate_hz: 2.0
  origin:
    latitude: 63.44228538325694
    longitude: 10.42402403234536
    name: "GPS 1 - Slalom Start"
  gps_points:
    - id: 1
      latitude: 63.44228538325694
      longitude: 10.42402403234536
      dms: '63°26''32.2"N 10°25''26.5"E'
      name: "GPS 1 - Slalom Start"
    - id: 2
      latitude: 63.4425333333
      longitude: 10.42402403234536
      dms: '63°26''32.2"N 10°25''26.5"E'
      name: "GPS 2 - Slalom Finish"

    # --- Task 1.2 (cardinal marker recognition, issue #46) ---
    # Reference points only; not used as route waypoints (route uses the
    # Cartesian slalom coordinates below, matching task1_sim/config/task1_params.yaml).
    - id: 3
      latitude: 35.6675575459
      longitude: 139.7933614800
      name: "GPS 3 - Task1.2 diagonal start (corner C)"
    - id: 4
      latitude: 35.6674742121
      longitude: 139.7938614790
      name: "GPS 4 - Task1.2 diagonal goal (corner A)"

  # Full Task1 route: task1-1's maneuvering waypoints, followed by the
  # cardinal-marker S/N/S slalom. This order matches task1_sim's evaluation
  # sequence (waypoint1_xy, GPS checkpoints, then waypoint2_xy).
  waypoints:
    - id: 1
      x: 0.0000
      y: 0.0000
      yaw: 0.4636
      type: "start"
      name: "GPS 1 - Task1-1 Start"
      tolerance_m: 5.0

    - id: 2
      x: 10.0000
      y: 5.0000
      yaw: -1.0304
      type: "waypoint"
      name: "Task1-1 waypoint 1"
      tolerance_m: 5.0

    - id: 3
      x: 13.0000
      y: 0.0000
      yaw: -1.0304
      type: "waypoint"
      name: "Task1-1 waypoint 2"
      tolerance_m: 2.0

    - id: 4
      x: 16.0000
      y: -5.0000
      yaw: 0.9828
      type: "waypoint"
      name: "Task1-1 waypoint 3"
      tolerance_m: 2.0

    - id: 5
      x: 19.0000
      y: -0.5000
      yaw: 1.1384
      type: "waypoint"
      name: "Task1-1 waypoint 4"
      tolerance_m: 2.0

    - id: 6
      x: 22.0000
      y: 6.0000
      yaw: -1.1071
      type: "waypoint"
      name: "Task1-1 waypoint 5"
      tolerance_m: 2.0

    - id: 7
      x: 25.0000
      y: 0.0000
      yaw: -1.0304
      type: "waypoint"
      name: "Task1-1 waypoint 6"
      tolerance_m: 2.0

    - id: 8
      x: 28.0000
      y: -5.0000
      yaw: 0.9273
      type: "waypoint"
      name: "Task1-1 waypoint 7"
      tolerance_m: 2.0

    - id: 9
      x: 31.0000
      y: -1.0000
      yaw: 0.7854
      type: "waypoint"
      name: "Task1-1 waypoint 8"
      tolerance_m: 2.0

    - id: 10
      x: 34.0000
      y: 2.0000
      yaw: -0.3218
      type: "waypoint"
      name: "Task1-1 waypoint 9"
      tolerance_m: 2.0

    - id: 11
      x: 40.0000
      y: 0.0000
      yaw: 0.0000
      type: "waypoint"
      name: "Task1-1 waypoint 10"
      tolerance_m: 2.0

    - id: 12
      x: 50.0000
      y: 0.0000
      yaw: -1.5708
      type: "transit"
      name: "Transit - clear of marker corridor"
      tolerance_m: 2.0

    - id: 13
      x: 50.0000
      y: -25.0000
      yaw: -2.7744
      type: "start"
      name: "GPS 2 - Slalom Start"
      tolerance_m: 2.0

    - id: 14
      x: 24.0000
      y: -35.0000
      yaw: 1.9937
      type: "turn"
      name: "Slalom turn 1 (pass south of marker 1, S)"
      tolerance_m: 2.0

    - id: 15
      x: 15.0000
      y: -15.0000
      yaw: -1.9075
      type: "turn"
      name: "Slalom turn 2 (pass north of marker 2, N)"
      tolerance_m: 2.0

    - id: 16
      x: 8.0000
      y: -35.0000
      yaw: 2.2455
      type: "turn"
      name: "Slalom turn 3 (pass south of marker 3, S)"
      tolerance_m: 2.0

    - id: 17
      x: 0.0000
      y: -25.0000
      yaw: 2.2455
      type: "goal"
      name: "GPS 2 - Slalom Finish"
      tolerance_m: 2.0

  constraints:
    follow_test: false
    route_pattern: "task1_1_then_cardinal_slalom"
    cardinal_marker_detection: true
    vision_halfway: false

