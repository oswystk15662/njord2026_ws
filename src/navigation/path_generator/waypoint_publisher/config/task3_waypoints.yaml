# Task 3: Docking Scenarios
# Waypoint configuration for NJORD competition Task 3
# Supports both normal docking (3.1) and parallel docking (3.2)
#
# Rulebook default sequence:
#   task3_1: gps7(start) -> gps8(gate midpoint) -> berth1 approach -> berth1
#     -> berth1 exit -> gps8(finish)
#   task3_2: gps9(start) -> gps9 gate midpoint -> berth2 approach -> berth2
#     -> gps10(finish)
#
# Optional continuous sequence (run_full_sequence:=true):
#   gps7(start) -> gps8(gate midpoint) -> berth1 approach -> berth1
#     -> berth1 exit -> gps9(gate midpoint) -> berth2 approach -> berth2 -> gps10(finish)
#
# Field geometry (point-symmetric about origin):
#   Normal dock (3.1):   x=14~16, y=±2.0  (boat enters from west, heading=0)
#   Parallel dock (3.2): x=-14~-16, y=±2.0 (boat enters from east, heading=π)
#   Gate buoys 3.1:      x≈12, y=±4  (red/green)
#   Gate buoys 3.2:      x≈-12, y=±4  (red/green)

task3_1_config:
  frame_id: "map"
  publish_rate_hz: 2.0
  scenario: "normal_docking_rulebook"

  waypoints:
    # GPS 7: start (origin)
    - id: 7
      x: 0.0
      y: 0.0
      yaw: 0.0
      type: "start"
      name: "GPS 7 - Start"
      tolerance_m: 2.0

    # GPS 8: gate center between b31_red_gate and b31_green_gate
    - id: 8
      x: 13.0
      y: 10.0
      yaw: 1.5708        # heading north (π/2)
      type: "gate"
      name: "GPS 8 - Normal Dock Gate"
      tolerance_m: 1.5
      gate_pair:
        red_frame: "b31_red_gate"
        green_frame: "b31_green_gate"

    # Safe mouth point before entering the normal dock slot.
    - id: "berth1_approach"
      x: 13.25
      y: 1.065
      yaw: 0.0
      type: "dock_approach"
      name: "Berth 1 - Approach"
      tolerance_m: 0.8

    # Berth 1: normal docking (center berth, heading east into dock)
    - id: "berth1"
      x: 15.0
      y: 1.065
      yaw: 0.0           # heading east (into normal dock)
      type: "dock"
      name: "Berth 1 - Normal Dock"
      tolerance_m: 0.8
      dock_type: "normal"

    # Back out to the mouth before navigating away from the dock.
    - id: "berth1_exit"
      x: 13.25
      y: 1.065
      yaw: 3.14159
      type: "undock_exit"
      name: "Berth 1 - Exit"
      tolerance_m: 1.5

    # GPS 9: gate center between b32_red_gate and b32_green_gate
    - id: 9
      x: -13.0
      y: -10.0
      yaw: -1.5708       # heading south toward parallel dock gate
      type: "gate"
      name: "GPS 9 - Parallel Dock Gate"
      tolerance_m: 1.5
      gate_pair:
        red_frame: "b32_red_gate"
        green_frame: "b32_green_gate"

    # Safe mouth point before entering the parallel dock.
    - id: "berth2_approach"
      x: -13.25
      y: 0.0
      yaw: 3.14159
      type: "dock_approach"
      name: "Berth 2 - Approach"
      tolerance_m: 0.8

    # Berth 2: parallel docking (heading west into parallel dock)
    - id: "berth2"
      x: -15.0
      y: 0.0
      yaw: 3.14159       # heading west (into parallel dock, π)
      type: "dock"
      name: "Berth 2 - Parallel Dock"
      tolerance_m: 0.8
      dock_type: "parallel"

    # GPS 10: finish point (exit parallel dock, go south)
    - id: 10
      x: -13.0
      y: -11.0
      yaw: -1.5708       # heading south
      type: "goal"
      name: "GPS 10 - Finish"
      tolerance_m: 2.0

  constraints:
    dock_identification: "ar_tag_detection"
    impact_minimization: true
    wait_time_s: 10           # wait at berth before undocking
    second_wait_time_s: 5     # task3_2 wait during run_full_sequence
    wait_condition: "after_docking_stationary"
    reversal_requirement: true
    attempts: 2
    goal_tolerance: 1.0

  stages:
    stage_1: [7, 8, "berth1_approach", "berth1"]
    stage_2: ["berth1_exit", 8]
    stage_3: []

  full_sequence_stages:
    stage_1: [7, 8, "berth1_approach", "berth1"]
    stage_2: ["berth1_exit", 9, "berth2_approach", "berth2"]
    stage_3: [10]


# Task 3.2 only config (standalone point-symmetric run, robot starts from rest)
task3_2_config:
  frame_id: "map"
  publish_rate_hz: 2.0
  scenario: "parallel_docking_standalone"

  waypoints:
    # Start at origin
    - id: 9
      x: 0.0
      y: 0.0
      yaw: 3.14159       # heading west
      type: "start"
      name: "GPS 9 - Start (standalone)"
      tolerance_m: 2.0

    # Gate for parallel dock, centered between b32_red_gate and b32_green_gate
    - id: "9_gate"
      x: -13.0
      y: -10.0
      yaw: -1.5708
      type: "gate"
      name: "GPS 9 - Parallel Dock Gate"
      tolerance_m: 1.5
      gate_pair:
        red_frame: "b32_red_gate"
        green_frame: "b32_green_gate"

    # Safe mouth point before entering the parallel dock.
    - id: "berth2_approach"
      x: -13.25
      y: 0.0
      yaw: 3.14159
      type: "dock_approach"
      name: "Berth 2 - Approach"
      tolerance_m: 0.8

    # Berth 2: parallel docking
    - id: "berth2"
      x: -15.0
      y: 0.0
      yaw: 3.14159
      type: "dock"
      name: "Berth 2 - Parallel Dock"
      tolerance_m: 0.8
      dock_type: "parallel"

    # GPS 10: finish
    - id: 10
      x: -13.0
      y: -11.0
      yaw: -1.5708
      type: "goal"
      name: "GPS 10 - Finish"
      tolerance_m: 2.0

  constraints:
    dock_type: "barge"
    impact_minimization: true
    wait_time_s: 5
    wait_condition: "after_parallel_docking_stationary"
    exit_movement: "forward_not_reverse"
    attempts: 2
    goal_tolerance: 1.0

  stages:
    stage_1: [9, "9_gate", "berth2_approach", "berth2"]
    stage_2: []
    stage_3: [10]


# Reference full-sequence async flow for task3 (handled by waypoint_publisher_node.py)
# The rulebook default uses task3_1_config.stages and task3_2_config.stages above.
async_flow:
  stage_1:
    name: "Approach Normal Dock"
    waypoints: [7, 8, "berth1_approach", "berth1"]
    next_trigger: "goal_reached"

  stage_2:
    name: "Stationary Wait at Berth 1"
    duration_s: 10
    next_trigger: "timer_complete"

  stage_3:
    name: "Undock and Approach Parallel Dock"
    waypoints: ["berth1_exit", 9, "berth2_approach", "berth2"]
    next_trigger: "goal_reached"

  stage_4:
    name: "Stationary Wait at Berth 2"
    duration_s: 5
    next_trigger: "timer_complete"

  stage_5:
    name: "Exit to Finish"
    waypoints: [10]
