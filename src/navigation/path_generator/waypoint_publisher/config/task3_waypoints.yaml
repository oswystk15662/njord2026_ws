# Task 3: Docking Scenarios
# test07089 pool experiment (issues #48/#49): single physical dock, so task3_1
# and task3_2 share the same GPS points (GPS7 == GPS9, GPS8 == GPS10).
#
# Full competition sequence (task3_1 → task3_2):
#   gps7(start) → gps8(gate) → berth1(normal dock) → gps8(exit) → gps9(gate2) → berth2(parallel dock) → gps10(finish)
#
# Field geometry (single-dock centerline layout, pool corners in task1_waypoints.yaml):
#   start   = GPS7/GPS9 = short-edge B-C midpoint
#   dock    = GPS8/GPS10 = near short-edge A-D midpoint (2 m inset from the far wall);
#             berth1 (normal) and berth2 (parallel) are the same physical spot
#   gate    = on the start->dock centerline, 32 m from start (red/green buoy pass)
#   heading = -0.7889 rad (constant, same bearing as task1's long-edge leg)
#
# Note: the competition's "exit forward past the dock to finish" does not fit in
# this pool (dock sits 2 m from the wall); GPS10/finish below is a nominal point
# inside the pool for the state-machine dry run, and may need on-site adjustment.
# task3_2 (single dock, 4 waypoints) is the primary on-water config; task3_1
# (7 waypoints, docks twice at the same physical berth) exercises the full
# state machine but is not the primary water test.

task3_1_config:
  frame_id: "map"
  publish_rate_hz: 2.0
  scenario: "normal_docking_full"

  origin:
    latitude: 35.6676408786
    longitude: 139.7934587022
    name: "GPS 7/9 - Start (short-edge B-C midpoint)"
  gps_points:
    - id: 7
      latitude: 35.6676408786
      longitude: 139.7934587022
      name: "GPS 7 - Start (BC midpoint)"
    - id: 8
      latitude: 35.6673908794
      longitude: 139.7937642567
      name: "GPS 8 - Dock (near AD midpoint)"
    - id: 9
      latitude: 35.6676408786
      longitude: 139.7934587022
      name: "GPS 9 - Start (BC midpoint, == GPS7)"
    - id: 10
      latitude: 35.6673908794
      longitude: 139.7937642567
      name: "GPS 10 - Dock (near AD midpoint, == GPS8)"

  waypoints:
    # GPS 7: start (origin, short-edge B-C midpoint)
    - id: 7
      x: 0.0
      y: 0.0
      yaw: -0.7889
      type: "start"
      name: "GPS 7 - Start"
      tolerance_m: 2.0

    # GPS 8: gate on the start->dock centerline (red/green buoy pass)
    - id: 8
      x: 22.547
      y: -22.707
      yaw: -0.7889
      type: "gate"
      name: "GPS 8 - Normal Dock Gate"
      tolerance_m: 1.5

    # Berth 1: normal docking (near short-edge A-D midpoint, 2 m inset)
    - id: "berth1"
      x: 26.226
      y: -26.412
      yaw: -0.7889       # heading into dock, same as approach bearing
      type: "dock"
      name: "Berth 1 - Normal Dock"
      tolerance_m: 0.8
      dock_type: "normal"

    # GPS 8 again: undock and return to gate
    - id: "8_exit"
      x: 22.547
      y: -22.707
      yaw: 2.3527        # heading back out
      type: "undock_exit"
      name: "GPS 8 - Exit Normal Dock"
      tolerance_m: 1.5

    # GPS 9: re-approach gate (same physical gate, one dock)
    - id: 9
      x: 22.547
      y: -22.707
      yaw: -0.7889
      type: "gate"
      name: "GPS 9 - Parallel Dock Gate"
      tolerance_m: 1.5

    # Berth 2: parallel docking (same physical berth as berth1)
    - id: "berth2"
      x: 26.226
      y: -26.412
      yaw: -0.7889
      type: "dock"
      name: "Berth 2 - Parallel Dock"
      tolerance_m: 0.8
      dock_type: "parallel"

    # GPS 10: nominal finish point inside the pool (see header note)
    - id: 10
      x: 27.380
      y: -19.060
      yaw: 1.4159
      type: "goal"
      name: "GPS 10 - Finish"
      tolerance_m: 2.0

  constraints:
    dock_identification: "ar_tag_detection"
    impact_minimization: true
    wait_time_s: 10           # wait at berth before undocking
    wait_condition: "after_docking_stationary"
    reversal_requirement: true
    attempts: 2
    goal_tolerance: 1.0


# Task 3.2 only config (standalone single-dock run, robot starts from rest)
task3_2_config:
  frame_id: "map"
  publish_rate_hz: 2.0
  scenario: "parallel_docking_standalone"

  origin:
    latitude: 35.6676408786
    longitude: 139.7934587022
    name: "GPS 9 - Start (short-edge B-C midpoint, == GPS7)"
  gps_points:
    - id: 9
      latitude: 35.6676408786
      longitude: 139.7934587022
      name: "GPS 9 - Start (BC midpoint, == GPS7)"
    - id: 10
      latitude: 35.6673908794
      longitude: 139.7937642567
      name: "GPS 10 - Dock (near AD midpoint, == GPS8)"

  waypoints:
    # Start at origin (short-edge B-C midpoint)
    - id: 9
      x: 0.0
      y: 0.0
      yaw: -0.7889
      type: "start"
      name: "GPS 9 - Start (standalone)"
      tolerance_m: 2.0

    # Gate on the start->dock centerline
    - id: "9_gate"
      x: 22.547
      y: -22.707
      yaw: -0.7889
      type: "gate"
      name: "GPS 9 - Parallel Dock Gate"
      tolerance_m: 1.5

    # Berth 2: parallel docking (near short-edge A-D midpoint, 2 m inset)
    - id: "berth2"
      x: 26.226
      y: -26.412
      yaw: -0.7889
      type: "dock"
      name: "Berth 2 - Parallel Dock"
      tolerance_m: 0.8
      dock_type: "parallel"

    # GPS 10: nominal finish point inside the pool (see header note)
    - id: 10
      x: 27.380
      y: -19.060
      yaw: 1.4159
      type: "goal"
      name: "GPS 10 - Finish"
      tolerance_m: 2.0

  constraints:
    dock_type: "barge"
    impact_minimization: true
    wait_time_s: 5
    wait_condition: "after_parallel_docking_stationary"
    exit_movement: "forward_not_reverse"
    attempts: 2
    goal_tolerance: 1.0


# Multi-stage async flow for task3 (handled by waypoint_publisher_node.py state machine)
# Stage 1: 7 → 8 → berth1       (approach + normal dock)
# Wait:    stationary at berth1 for wait_time_s
# Stage 2: 8_exit → 9 → berth2  (undock + gate + parallel dock)
# Wait:    stationary at berth2 for wait_time_s
# Stage 3: 10                    (exit + finish)
async_flow:
  stage_1:
    name: "Approach Normal Dock"
    waypoints: [7, 8, "berth1"]
    next_trigger: "goal_reached"

  stage_2:
    name: "Stationary Wait at Berth 1"
    duration_s: 10
    next_trigger: "timer_complete"

  stage_3:
    name: "Undock and Approach Parallel Dock"
    waypoints: ["8_exit", 9, "berth2"]
    next_trigger: "goal_reached"

  stage_4:
    name: "Stationary Wait at Berth 2"
    duration_s: 5
    next_trigger: "timer_complete"

  stage_5:
    name: "Exit to Finish"
    waypoints: [10]
