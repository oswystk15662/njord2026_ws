# Task 3: Docking Scenarios
# Waypoint configuration for NJORD competition Task 3
# Supports both normal docking (3.1) and parallel docking (3.2)
#
# Rulebook default sequence:
#   task3_1: gps7(start) -> buoy corridor midpoint -> gps8(gate midpoint, stop)
#     -> berth1 approach -> berth1
#     -> berth1 exit -> gps8(finish)
#   task3_2: gps9(start) -> buoy corridor midpoint -> gps9 gate midpoint(stop)
#     -> berth2 approach -> berth2
#     -> gps10(finish)
#
# Optional continuous sequence (run_full_sequence:=true):
#   gps7(start) -> buoy corridor midpoint -> gps8(gate midpoint, stop)
#     -> berth1 approach -> berth1
#     -> berth1 exit -> mirrored corridor midpoint -> gps9(gate midpoint)
#     -> berth2 approach -> berth2 -> gps10(finish)
#
# Enter every waypoint as WGS84 latitude/longitude.  `/fromLL` projects them
# to map at run time.  The values below are sample course data and must be
# replaced with the surveyed Task3 points before field operation.

task3_1_config:
  frame_id: "map"
  publish_rate_hz: 2.0
  scenario: "normal_docking_rulebook"

  waypoints:
    # GPS 7: start (origin)
    - id: 7
      latitude: 34.5456666667
      longitude: 135.5070555556
      yaw: 0.0
      type: "start"
      name: "GPS 7 - Start"
      tolerance_m: 2.0

    # GPS 8: gate center between b31_red_gate and b31_green_gate
    - id: 8
      latitude: 34.5457564978
      longitude: 135.5072518662
      yaw: 1.5708        # heading north (π/2)
      type: "gate"
      name: "GPS 8 - Normal Dock Gate"
      tolerance_m: 1.5
      gate_pair:
        red_frame: "b31_red_gate"
        green_frame: "b31_green_gate"

    # Midpoint of the deepest pair in the first three buoy sets.
    # This keeps the global plan inside the red/green buoy corridor.
    - id: "b31_corridor_gate"
      latitude: 34.5456666667
      longitude: 135.5071864293
      yaw: 0.0
      type: "corridor_gate"
      name: "Task3.1 Buoy Corridor Gate"
      tolerance_m: 1.0

    # Safe mouth point before entering the normal dock slot.
    - id: "berth1_approach"
      latitude: 34.5456762337
      longitude: 135.5072545927
      yaw: 0.0
      type: "dock_approach"
      name: "Berth 1 - Approach"
      tolerance_m: 0.8

    # Berth 1: normal docking (center berth, heading east into dock)
    - id: "berth1"
      latitude: 34.5456762337
      longitude: 135.5072736785
      yaw: 0.0           # heading east (into normal dock)
      type: "dock"
      name: "Berth 1 - Normal Dock"
      tolerance_m: 0.8
      dock_type: "normal"

    # Back out to the mouth before navigating away from the dock.
    - id: "berth1_exit"
      latitude: 34.5456762337
      longitude: 135.5072545927
      yaw: 3.14159
      type: "undock_exit"
      name: "Berth 1 - Exit"
      tolerance_m: 1.5

    # GPS 9: gate center between b32_red_gate and b32_green_gate
    - id: 9
      latitude: 34.5455768356
      longitude: 135.5068592450
      yaw: -1.5708       # heading south toward parallel dock gate
      type: "gate"
      name: "GPS 9 - Parallel Dock Gate"
      tolerance_m: 1.5
      gate_pair:
        red_frame: "b32_red_gate"
        green_frame: "b32_green_gate"

    # Point-symmetric corridor gate for Task3.2.
    - id: "b32_corridor_gate"
      latitude: 34.5456666667
      longitude: 135.5069246819
      yaw: 3.14159
      type: "corridor_gate"
      name: "Task3.2 Buoy Corridor Gate"
      tolerance_m: 1.0

    # Safe mouth point before entering the parallel dock.
    - id: "berth2_approach"
      latitude: 34.5456666667
      longitude: 135.5068565185
      yaw: 3.14159
      type: "dock_approach"
      name: "Berth 2 - Approach"
      tolerance_m: 0.8

    # Berth 2: parallel docking (heading west into parallel dock)
    - id: "berth2"
      latitude: 34.5456666667
      longitude: 135.5068374327
      yaw: 3.14159       # heading west (into parallel dock, π)
      type: "dock"
      name: "Berth 2 - Parallel Dock"
      tolerance_m: 0.8
      dock_type: "parallel"

    # GPS 10: finish point (exit parallel dock, go south)
    - id: 10
      latitude: 34.5455678525
      longitude: 135.5068592450
      yaw: -1.5708       # heading south
      type: "goal"
      name: "GPS 10 - Finish"
      tolerance_m: 2.0

  constraints:
    dock_identification: "ar_tag_detection"
    impact_minimization: true
    wait_time_s: 10           # wait at berth before undocking
    second_wait_time_s: 5     # task3_2 wait during run_full_sequence
    wait_condition: "after_docking_stationary"
    reversal_requirement: true
    attempts: 2
    goal_tolerance: 1.0

  stages:
    stage_1_gate: [7, "b31_corridor_gate", 8]
    stage_1: ["berth1_approach", "berth1"]
    stage_2: ["berth1_exit", 8]
    stage_3: []

  full_sequence_stages:
    stage_1_gate: [7, "b31_corridor_gate", 8]
    stage_1: ["berth1_approach", "berth1"]
    stage_2: ["berth1_exit", "b32_corridor_gate", 9, "berth2_approach", "berth2"]
    stage_3: [10]


# Task 3.2 only config (standalone point-symmetric run, robot starts from rest)
task3_2_config:
  frame_id: "map"
  publish_rate_hz: 2.0
  scenario: "parallel_docking_standalone"

  waypoints:
    # Start at origin
    - id: 9
      latitude: 34.5456666667
      longitude: 135.5070555556
      yaw: 3.14159       # heading west
      type: "start"
      name: "GPS 9 - Start (standalone)"
      tolerance_m: 2.0

    # Gate for parallel dock, centered between b32_red_gate and b32_green_gate
    - id: "9_gate"
      latitude: 34.5455768356
      longitude: 135.5068592450
      yaw: -1.5708
      type: "gate"
      name: "GPS 9 - Parallel Dock Gate"
      tolerance_m: 1.5
      gate_pair:
        red_frame: "b32_red_gate"
        green_frame: "b32_green_gate"

    # Midpoint of the deepest pair in the first three mirrored buoy sets.
    - id: "b32_corridor_gate"
      latitude: 34.5456666667
      longitude: 135.5069246819
      yaw: 3.14159
      type: "corridor_gate"
      name: "Task3.2 Buoy Corridor Gate"
      tolerance_m: 1.0

    # Safe mouth point before entering the parallel dock.
    - id: "berth2_approach"
      latitude: 34.5456666667
      longitude: 135.5068565185
      yaw: 3.14159
      type: "dock_approach"
      name: "Berth 2 - Approach"
      tolerance_m: 0.8

    # Berth 2: parallel docking
    - id: "berth2"
      latitude: 34.5456666667
      longitude: 135.5068374327
      yaw: 3.14159
      type: "dock"
      name: "Berth 2 - Parallel Dock"
      tolerance_m: 0.8
      dock_type: "parallel"

    # GPS 10: finish
    - id: 10
      latitude: 34.5455678525
      longitude: 135.5068592450
      yaw: -1.5708
      type: "goal"
      name: "GPS 10 - Finish"
      tolerance_m: 2.0

  constraints:
    dock_type: "barge"
    impact_minimization: true
    wait_time_s: 5
    wait_condition: "after_parallel_docking_stationary"
    exit_movement: "forward_not_reverse"
    attempts: 2
    goal_tolerance: 1.0

  stages:
    stage_1_gate: [9, "b32_corridor_gate", "9_gate"]
    stage_1: ["berth2_approach", "berth2"]
    stage_2: []
    stage_3: [10]


# Reference full-sequence async flow for task3 (handled by waypoint_publisher_node.py)
# The rulebook default uses task3_1_config.stages and task3_2_config.stages above.
async_flow:
  stage_1:
    name: "Approach GPS8 Gate"
    waypoints: [7, "b31_corridor_gate", 8]
    next_trigger: "goal_reached"

  stage_2:
    name: "Approach Normal Dock"
    waypoints: ["berth1_approach", "berth1"]
    next_trigger: "goal_reached"

  stage_3:
    name: "Stationary Wait at Berth 1"
    duration_s: 10
    next_trigger: "timer_complete"

  stage_4:
    name: "Undock and Approach Parallel Dock"
    waypoints: ["berth1_exit", "b32_corridor_gate", 9, "berth2_approach", "berth2"]
    next_trigger: "goal_reached"

  stage_5:
    name: "Stationary Wait at Berth 2"
    duration_s: 5
    next_trigger: "timer_complete"

  stage_6:
    name: "Exit to Finish"
    waypoints: [10]
