critical_link_receiver:
  ros__parameters:
    joy_output_topic: /joy
    heartbeat_output_topic: /heartbeat/ground_station
    diagnostic_stale_after_sec: 3.0
    # Format: name|miniPC bind IPv4 or hostname|UDP port
    udp_paths:
      # - "usb_wifi|192.168.212.210|45100"
      # - "builtin_wifi|192.168.212.22|45101"
      # - "v1_internet_vpn|100.82.157.125|45103"
      - "v1_internet_vpn|100.123.47.2|45103"
    # Use a stable /dev/serial/by-id path for the vessel ESP32.
    serial_device: ""
    serial_baud: 921600
    key_file: /etc/njord/critical_link.key
    max_frame_age_ms: 2000
    future_tolerance_ms: 1000
