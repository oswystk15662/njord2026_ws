# Task 2 parameter file
# =====================
# This is the single source of Task 2-specific tuning.  It is supplied to
# every Task 2 perception node launched by task2_autonomy.launch.py and the
# rosbag-only task2_bag_perception.launch.py.
# Generic package defaults remain in their own packages; do not put general
# platform settings here.
#
# Values marked HUMAN must be checked on the physical vessel.

# ---------------------------------------------------------------------------
# LiDAR cloud preparation: /livox/lidar -> /task2/points_filtered
# ---------------------------------------------------------------------------
task2_cloud_filter:
  ros__parameters:
    input_topic: "/livox/lidar"             # Raw Livox PointCloud2 input
    output_topic: "/task2/points_filtered"  # Input for Task 2 PCL pipeline
    visual_output_topic: "/task2/points_filtered_visual"  # Display only
    publish_visual_z_mirror: true            # Does not affect recognition
    output_frame: "base_link"
    min_range_m: 1.5                         # [m] remove own-hull near field
    max_range_m: 40.0                        # [m] required encounter range
    # Set positive only after checking real sensor point density.  A failed
    # health check suppresses output instead of claiming an empty sea.
    min_valid_input_points: 0
    publish_empty_on_invalid_input: false
    voxel_leaf_size_m: 0.0                   # Downsampling is below (0.15 m)
    accumulation_frames: 1                   # Never merge raw frame history
    process_rate_hz: 5.0                     # [Hz] latest frame only; 0=all
    # Emergency-only pre-rotation.  The URDF TF is normally authoritative.
    lidar_inverted: false
    lidar_roll_deg: 0.0
    lidar_pitch_deg: 0.0
    lidar_yaw_deg: 0.0
    # HUMAN: water surface height relative to base_link.
    waterline_z_m: 0.0                       # [m]
    water_remove_min_z_m: -0.3               # [m] water-band lower edge
    water_remove_max_z_m: 0.15               # [m] water-band upper edge
    water_plane_distance_threshold_m: 0.05   # [m] used only if RANSAC=true
    water_plane_normal_z_min: 0.9
    water_plane_max_height_error_m: 0.3      # [m]
    use_water_plane_ransac: false            # fixed water band is cheaper
    # HUMAN: own-vessel bounding box; points inside are removed.
    self_crop_min_x: -1.2
    self_crop_max_x: 1.2
    self_crop_min_y: -0.8
    self_crop_max_y: 0.8
    self_crop_min_z: -0.5
    self_crop_max_z: 1.5
    # Visualization parameters only; they do not enter recognition.
    publish_self_marker: true
    self_marker_topic: "/task2/self_vessel_marker"
    self_marker_publish_rate_hz: 1.0
    self_marker_yaw_deg: 0.0
    object_min_z_m: 0.15                     # [m] retain objects above water
    object_max_z_m: 1.5                      # [m] Task 2 vessel height
    publish_debug: false                      # debug clouds stay disabled

# ---------------------------------------------------------------------------
# Candidate selection and absolute target velocity output
# ---------------------------------------------------------------------------
opponent_selector:
  ros__parameters:
    tracked_objects_topic: "/tracked_objects"
    ego_odom_topic: "/odometry/filtered/local"
    twist_topic: "/other_ship/twist"         # map-frame, absolute [m/s]
    map_frame: "map"
    base_frame: "base_link"
    opponent_frame: "opponent_vessel"
    confirmed_only: true
    max_distance_m: 60.0                      # [m] track selection distance
    selection_policy: "nearest"               # nearest|min_tcpa|track_id
    target_track_id: -1
    # Catamaran horizontal dimensions. Height is intentionally not gated.
    min_length_m: 0.9                          # [m], allow sparse far-range hull returns
    max_length_m: 2.5                          # [m], includes measurement error
    min_width_m: 0.4                           # [m], retain buoy rejection while allowing sparse returns
    max_width_m: 1.5                           # [m], includes measurement error
    min_height_m: 0.15                         # [m], reject water-surface speckle
    max_height_m: 1.5                          # [m], small Task 2 vessel hull/superstructure
    min_point_count: 0                         # 0 disables this optional gate
    stale_timeout_sec: 2.0                     # [s]
    publish_rate_hz: 10.0                      # [Hz] output update rate
    twist_lowpass_alpha: 0.3
    # Task 2 launch selects straight_line; standard remains available.
    motion_filter_mode: "straight_line"       # standard|straight_line
    straight_min_hit_count: 5                  # 5 Hz -> roughly 1 s history
    straight_max_velocity_stddev_mps: 0.50     # [m/s] tolerate real LiDAR velocity noise
    # A confirmed Task 2 target keeps its straight-line prediction through
    # LiDAR occlusion; tentative tracks never enable this behavior.
    straight_continue_after_loss: true
    # When LiDAR briefly loses a confirmed vessel, keep publishing this
    # constant-velocity prediction.  0 disables coasting; expiry is silent.
    straight_coast_timeout_sec: 2.0            # [s]
    # Operator-facing speed gate. Twist output remains SI m/s.
    min_absolute_speed_knots: 0.3              # [kn] reject stationary buoys, retain slow vessels
    max_absolute_speed_knots: 6.0              # [kn] tolerate estimate error; MPPI remains fixed at 2.5 kn
    # Recognition rectangle fixed in the map frame to GPS point 5 -> 6.
    # It begins 5 m after GPS5, ends 5 m past GPS6, and is 40 m wide.
    # task2_waypoint_pose_publisher resolves the GPS points through /fromLL.
    corridor_enabled: true
    corridor_start_topic: "/waypoint1_pose"    # GPS 5, map frame
    corridor_end_topic: "/waypoint2_pose"      # GPS 6, map frame
    corridor_start_offset_m: 5.0
    corridor_end_margin_m: 5.0
    corridor_half_width_m: 20.0

# ---------------------------------------------------------------------------
# Route-side buoy selector: shared tracker -> coloured stationary buoys
# ---------------------------------------------------------------------------
task2_buoy_selector:
  ros__parameters:
    tracked_objects_topic: "/tracked_objects"
    ego_odom_topic: "/task2/ego_odom"
    output_topic: "/task2/buoy_detections"  # njord_interfaces/BuoyDetectionArray
    legacy_point_topic: "/buoy_detections"  # PointStamped compatibility feed
    map_frame: "map"
    base_frame: "base_link"
    waypoint_start_topic: "/waypoint1_pose" # GPS 5
    waypoint_end_topic: "/waypoint2_pose"   # GPS 6
    # Left (+ lateral) is red; right (- lateral) is green.
    expected_lateral_offset_m: 2.5
    lateral_tolerance_m: 1.0
    start_margin_m: 2.0
    end_margin_m: 2.0
    confirmed_only: true
    min_hit_count: 5
    max_distance_m: 40.0
    # Matches the former camera + LiDAR fusion PCL detector's minimum
    # cluster population. That detector used no 3-D bounding-box gate.
    min_point_count: 5
    # The former buoy costmap used physical radius 0.45 m (diameter 0.9 m).
    # Permit 0.3 m of LiDAR clustering error, while rejecting vessel-sized
    # stationary tracks. Track dimensions are extents, not the old detector's
    # raw-sensor z height band (-1.0..0.5 m), so that old band is not copied.
    min_length_m: 0.0
    max_length_m: 1.2
    min_width_m: 0.0
    max_width_m: 1.2
    min_height_m: 0.0
    max_height_m: 1.5
    stale_timeout_sec: 2.0
    stationary_speed_max_mps: 0.35
    publish_rate_hz: 5.0

# ---------------------------------------------------------------------------
# PCL preprocessing: compact, current-frame cloud for Task 2 only
# ---------------------------------------------------------------------------
preprocessing_node:
  ros__parameters:
    voxel_leaf_x: 0.15                         # [m] voxel downsampling
    voxel_leaf_y: 0.15
    voxel_leaf_z: 0.15
    # Do not crop by instantaneous vessel x/y. The map-frame GPS5->6
    # rectangle above is the authoritative horizontal recognition range.
    roi_min_x: -40.0
    roi_max_x: 40.0
    roi_min_y: -40.0
    roi_max_y: 40.0
    roi_min_z: 0.15                            # [m] above water removal band
    roi_max_z: 1.5                             # [m] Task 2 vessel height
    min_range: 1.5                             # [m]
    max_range: 40.0                            # [m]
    accumulate_frames: false                   # avoids KD-tree inflation
    num_accumulate_frames: 1
    input_queue_depth: 1                       # drop stale clouds
    base_frame: "base_link"

# ---------------------------------------------------------------------------
# Water/ground removal: lower RANSAC cost after water-band removal above
# ---------------------------------------------------------------------------
ground_remover_node:
  ros__parameters:
    method: "ransac"
    ransac_distance_threshold: 0.2             # [m]
    ransac_max_iterations: 80                  # generic default is 150
    min_z_ground: -1.0                         # [m]
    max_z_ground: 0.5                          # [m]
    sensor_height: 1.5                         # [m], HUMAN: LiDAR height
    publish_ground_cloud: false
    input_queue_depth: 1                       # drop stale clouds

# ---------------------------------------------------------------------------
# Euclidean clustering: reject sea clutter and oversized structures early
# ---------------------------------------------------------------------------
cluster_node:
  ros__parameters:
    cluster_tolerance: 1.0                     # [m] neighbouring-point link
    min_cluster_size: 15                       # [points] retain sparse far-range hull returns
    max_cluster_size: 10000                    # [points] reject large structures
    min_cluster_height: 0.15                   # [m] reject water-surface speckle
    max_cluster_height: 1.5                    # [m] Task 2 vessel height
    max_cluster_horizontal_size: 5.0           # [m]
    publish_each_cluster: false
    input_queue_depth: 1                       # drop stale clouds

# ---------------------------------------------------------------------------
# EKF tracker: Task 2 straight-line confirmation window
# ---------------------------------------------------------------------------
ship_tracker_node:
  ros__parameters:
    # Keep every tracker threshold here; Task 2 launches load this file
    # directly rather than hiding values in launch files.
    motion_model: "cv"                         # cv|ctrv|ca
    motion_mode: "straight_line"               # standard|straight_line
    sigma_ax: 0.3
    sigma_ay: 0.3
    straight_sigma_ax: 0.12
    straight_sigma_ay: 0.12
    sigma_az: 0.05
    sigma_yaw_acc: 0.05
    R_diag_x: 0.5
    R_diag_y: 0.5
    R_diag_z: 0.3
    hits_to_confirm: 3
    straight_hits_to_confirm: 5                # 5 Hz -> roughly 1 s to confirm
    max_misses_confirmed: 8
    max_misses_tentative: 2
    mahalanobis_threshold: 9.0
    euclidean_gate_m: 50.0
    ego_compensation: true
    base_frame: "base_link"
    publish_tentative: false
    min_marker_speed_knots: 0.3
    max_marker_speed_knots: 6.0

# ---------------------------------------------------------------------------
# Safety cloud and Task 2 final automatic-command gate
# ---------------------------------------------------------------------------
task2_safety_cloud_filter:
  ros__parameters:
    input_topic: "/livox/lidar"
    output_topic: "/task2/safety_points"
    visual_output_topic: "/task2/safety_points_visual"
    output_frame: "base_link"
    min_range_m: 0.45
    max_range_m: 12.0
    min_valid_input_points: 0
    publish_empty_on_invalid_input: false
    voxel_leaf_size_m: 0.20
    accumulation_frames: 1
    process_rate_hz: 5.0
    lidar_inverted: false
    lidar_roll_deg: 0.0
    lidar_pitch_deg: 0.0
    lidar_yaw_deg: 0.0
    waterline_z_m: 0.0
    water_remove_min_z_m: -0.3
    water_remove_max_z_m: 0.15
    water_plane_distance_threshold_m: 0.05
    water_plane_normal_z_min: 0.9
    water_plane_max_height_error_m: 0.3
    use_water_plane_ransac: false
    self_crop_min_x: -0.30
    self_crop_max_x: 0.30
    self_crop_min_y: -0.30
    self_crop_max_y: 0.30
    self_crop_min_z: -0.50
    self_crop_max_z: 1.50
    object_min_z_m: -0.2
    object_max_z_m: 4.0
    publish_visual_z_mirror: false
    publish_self_marker: false
    self_marker_topic: "/task2/safety_self_vessel_marker"
    self_marker_publish_rate_hz: 1.0
    self_marker_yaw_deg: 0.0
    publish_debug: false

task2_safety_cloud_gate:
  ros__parameters:
    safety_topic: "/task2/safety_points"
    cmd_vel_in_topic: "/cmd_vel_collision_checked"
    cmd_vel_out_topic: "/cmd_vel_nav"
    safety_timeout_sec: 1.0
    command_timeout_sec: 0.5
    publish_rate_hz: 20.0

# ---------------------------------------------------------------------------
# Select exactly one odometry source for all Task 2 perception consumers
# ---------------------------------------------------------------------------
task2_odometry_selector:
  ros__parameters:
    # First available topic after the short selection window wins by order.
    candidate_topics:
      - "/odometry/filtered/local"
      - "/odom"
      - "/odometry/filtered/global"
    output_topic: "/task2/ego_odom"
    selection_window_sec: 1.0

# ---------------------------------------------------------------------------
# MPPI parameters coupled specifically to a detected opponent
# ---------------------------------------------------------------------------
planner_node:
  ros__parameters:
    buoy_detection_array_topic: "/task2/buoy_detections"
    other_ship_twist_topic: "/other_ship/twist"
    own_frame: "base_link"
    other_ship_frame: "opponent_vessel"
    require_other_ship: false
    other_twist_is_relative: false
    opponent_corridor_margin_m: 5.0
    opponent_corridor_half_width_m: 20.0
    opponent_speed_knots: 2.5
    # The remaining values define how the generated avoidance path returns to
    # the GPS 5->6 line.  Keep them alongside target-recognition parameters
    # so a field profile is entirely in this file.
    planning_frequency: 2.0
    point_spacing: 0.5
    avoid_radius: 2.0
    avoid_offset: 3.0
    reconnect_line_distance_m: 1.0
    reconnect_ahead_length_m: 5.0
    straight_path_spacing_m: 2.0
    straight_path_length_m: 60.0
    mppi_smoothing_window: 3
    mppi.opponent_loa: 1.8
