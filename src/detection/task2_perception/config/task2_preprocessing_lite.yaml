/**:
  ros__parameters:
    # Task 2 CPU-light ROI.  Keep the expected encounter sector while
    # removing far, rear, and high points before PCL ground removal.
    voxel_leaf_x: 0.15
    voxel_leaf_y: 0.15
    voxel_leaf_z: 0.15
    roi_min_x: -10.0
    roi_max_x: 40.0
    roi_min_y: -25.0
    roi_max_y: 25.0
    roi_min_z: -1.0
    roi_max_z: 4.0
    min_range: 1.5
    max_range: 40.0
    # Task 2 cloud filter already makes a 5 Hz latest-frame stream.  Do not
    # merge history again: it inflates the KD-tree and adds latency.
    accumulate_frames: false
    num_accumulate_frames: 1
    input_queue_depth: 1
    base_frame: "base_link"
