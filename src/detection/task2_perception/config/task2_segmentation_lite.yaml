/**:
  ros__parameters:
    # The Task 2 cloud filter removes the waterline band first.  Keep the
    # remaining RANSAC conservative, but halve its work from the generic
    # pipeline's 150 iterations.
    method: "ransac"
    ransac_distance_threshold: 0.2
    ransac_max_iterations: 80
    min_z_ground: -1.0
    max_z_ground: 0.5
    sensor_height: 1.5
    publish_ground_cloud: false
    input_queue_depth: 1

    # Catamaran-focused clustering.  A 0.15 m voxel grid has already removed
    # isolated returns, so reject tiny clusters and very large structures
    # before they reach the tracker.
    cluster_tolerance: 1.0
    min_cluster_size: 30
    max_cluster_size: 10000
    min_cluster_height: 0.2
    max_cluster_height: 4.0
    max_cluster_horizontal_size: 5.0
    publish_each_cluster: false
