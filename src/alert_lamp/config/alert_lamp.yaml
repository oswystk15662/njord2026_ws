alert_lamp_manager_node:
  ros__parameters:
    evaluation_rate_hz: 10.0
    lamp:
      green_blink_period_sec: 1.0
      yellow_blink_period_sec: 1.0
      red_blink_period_sec: 0.5
      duty_ratio: 0.5
    topics:
      control_state: /control/state
      mission_status: /mission/status
      health_state: /health/state
      alert_command: /alert_lamp/command

alert_lamp_driver_node:
  ros__parameters:
    command_timeout_sec: 1.0
    # Existing micon_driver_fd/serial_writer owns USB serial and consumes these Bool topics.
    output_type: topic
    topics:
      alert_command: /alert_lamp/command
      green: /green
      yellow: /yellow
      red: /red
