### Task3 simulation local EKF (odom -> base_link estimate topic) ###
# The real-vessel ekf_local.yaml intentionally keeps /livox/imu.  Simulation
# publishes /wit/imu, so the topic difference is isolated here rather than
# changing the hardware contract.
ekf_filter_node_local:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    print_diagnostics: true
    odom0: /odom
    odom0_config: [true, true, false,
                   false, false, true,
                   true, true, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    imu0: /wit/imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  true, true, false]
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
