task1_orchestrator:
  ros__parameters:
    frame_id: "map"

    # Official NJORD 2026 Task1 slalom course (Cartesian sim approximation):
    # spawn(0,0) -> (50,0) -> (50,-25) -> (24,-35) -> (15,-15) -> (8,-35) ->
    # (0,-25). The (50,0) transit point keeps the boat east of/above the
    # marker corridor (all markers sit at y=-25, x<=28) while it crosses
    # from spawn out to the course, so it doesn't cut through the cardinal
    # marks (and their /virtual_obstacles walls) before the slalom even
    # starts; only then does it turn south into the S/N/S slalom. GPS
    # checkpoints below bookend the route; waypoint1/2_xy hold interior
    # points so the orchestrator's own goal-tracking matches
    # waypoint_publisher's task1 route (see task1_waypoints.yaml).
    gps_checkpoint_xy: "[[0.0, 0.0], [50.0, 0.0], [50.0, -25.0], [0.0, -25.0]]"
    waypoint1_xy: "[]"
    waypoint2_xy: "[[24.0, -35.0], [15.0, -15.0], [8.0, -35.0]]"

    buoy_position_xy: "[[28.0, -25.0], [18.0, -25.0], [11.0, -25.0]]"
    # Cardinal orientation per marker, aligned index-wise with
    # buoy_position_xy: S (pass south), N (pass north), S (pass south) --
    # this is what makes the route above a slalom instead of a straight line.
    buoy_marks: "[\"S\", \"N\", \"S\"]"
    wall_radius: 2.5
    wall_points: 24
    goal_radius: 2.0
    waypoint_reach_radius: 2.0
    avoidance_eval_radius: 10.0
    avoidance_margin: 0.5
    # Testing override only: forces every marker (not just one) to this
    # cardinal mark, ignoring buoy_marks above. Leave empty for the
    # competition S/N/S slalom.
    forced_mark: ""

    # Visual course extent covering the slalom route (x:[0,50], y:[-35,-15])
    # with margin. The visual border is intentionally not added to Nav2
    # obstacles; cardinal_wall_publisher uses this same box (via the launch
    # file) as the far edge for each marker's exclusion wall.
    course_bounds: [-5.0, 55.0, -40.0, -10.0]
    # The old two-leg course (GPS1->GPS2 along y~0, then GPS3->GPS4 through
    # the slalom) used this as a physical /sim_obstacles line at y=-10 to
    # keep the two legs apart. The official slalom route lives entirely in
    # y=[-35,-15], so the line would only sit in the way of the transit from
    # spawn (0,0) to the first waypoint. Collapsed to a single point well
    # outside course_bounds so it stays a harmless no-op instead of a
    # planning obstacle.
    center_line: [0.0, 0.0, -45.0, 0.0]
    # Optional [min_x, max_x, min_y, max_y] blocker before marker detection.
    # Keep disabled by default because the full NavigateThroughPoses request
    # includes post-inference waypoints; blocking that area makes those goals
    # invalid before the route can start.
    pre_inference_block: "[]"
    obstacle_spacing: 0.25
    boundary_marker_step: 5.0

    seed: 2026
    publish_rate_hz: 2.0
