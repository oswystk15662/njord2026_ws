task1_orchestrator:
  ros__parameters:
    frame_id: "map"
    buoy_xy: [10.0, 0.0]
    wall_radius: 2.5
    wall_points: 24
    # 2点で1組のXY配列 (x0, y0, x1, y1, ...)
    gps_checkpoint_xy: [0.0, 0.0, 50.0, 0.0, 50.0, -25.0, 0.0, -25.0]

    # point4到達判定半径
    goal_radius: 2.0

    # waypoint通過半径
    waypoint_reach_radius: 2.0

    # check point間の10点
    waypoint1_xy: [
      10.0, 5.0,
      13.0, 0.0,
      16.0, -5.0,
      19.0, -0.5,
      22.0, 6.0,
      25.0, 0.0,
      28.0, -5.0,
      31.0, -1.0,
      34.0, 2.0,
      40.0, 0.0
    ]

    # waypoint2
    waypoint2_xy: [
      24.0, -35.0,
      15.0, -10.0,
      8.0, -35.0
    ]

    # buoy位置 (複数可)
    buoy_position_xy: [
      28.0, -25.0,
      18.0, -25.0,
      11.0, -25.0
    ]

    # 避航評価: buoy中心からこの半径内で最接近時の側方を評価
    avoidance_eval_radius: 8.0
    # 指定側への最小オフセット[m]
    avoidance_margin: 0.5
    # N/E/W/Sのいずれかで固定したい場合のみ設定。空ならランダム。
    forced_mark: ""

    seed: 2026
    publish_rate_hz: 2.0
