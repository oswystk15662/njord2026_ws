task1_orchestrator:
  ros__parameters:
    frame_id: "map"

    # Full Task1 course (Cartesian sim approximation): task1-1's ten-point
    # maneuvering section, then the cardinal-marker S/N/S slalom. GPS
    # checkpoints bookend the two sections; waypoint1_xy and waypoint2_xy
    # hold their interior points so task evaluation matches the Nav2 route.
    gps_checkpoint_xy: "[[0.0, 0.0], [50.0, 0.0], [50.0, -25.0], [0.0, -25.0]]"
    waypoint1_xy: >-
      [[10.0, 5.0], [13.0, 0.0], [16.0, -5.0], [19.0, -0.5], [22.0, 6.0],
       [25.0, 0.0], [28.0, -5.0], [31.0, -1.0], [34.0, 2.0], [40.0, 0.0]]
    waypoint2_xy: "[[24.0, -35.0], [15.0, -15.0], [8.0, -35.0]]"

    buoy_position_xy: "[[28.0, -25.0], [18.0, -25.0], [11.0, -25.0]]"
    # Official Task1 cardinal marks, interpreted against GNSS true north.
    # The S/N/S sequence matches the slalom waypoint route. Red and green
    # reference buoys are shown adjacent to each mark by the simulator.
    buoy_marks: "[\"S\", \"N\", \"S\"]"
    course_heading_rad: 3.141592653589793
    # Main waypoint 3: start retiring passed buoy walls from the next WP.
    wall_retirement_start_xy: [50.0, -25.0]
    wall_radius: 2.5
    wall_points: 24
    goal_radius: 2.0
    waypoint_reach_radius: 2.0
    avoidance_eval_radius: 10.0
    avoidance_margin: 0.5
    # Testing override only: forces every marker (not just one) to this
    # buoy class, ignoring buoy_marks above. Leave empty for the
    # competition cardinal-mark slalom.
    forced_mark: ""

    # This visual boundary includes spawn and every Task1-1/slalom waypoint.
    # It is not added to /sim_obstacles, but cardinal_wall_publisher uses it
    # as the far edge of a detected marker's one-sided exclusion wall.
    course_bounds: [-5.0, 55.0, -40.0, 35.0]
    # Physical divider between the task1-1 maneuvering section and the
    # slalom. The route reaches the slalom via x=50, beyond this divider.
    center_line: [0.0, 40.0, -10.0, 0.05]
    # Optional [min_x, max_x, min_y, max_y] blocker before marker detection.
    # Keep disabled by default because the full NavigateThroughPoses request
    # includes post-inference waypoints; blocking that area makes those goals
    # invalid before the route can start.
    pre_inference_block: "[]"
    obstacle_spacing: 0.25
    boundary_marker_step: 5.0

    seed: 2026
    publish_rate_hz: 2.0
