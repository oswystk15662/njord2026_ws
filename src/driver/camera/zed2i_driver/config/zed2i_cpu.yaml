zed2i:
  ros__parameters:
    left_device: /dev/video0
    right_device: /dev/video1
    left_frame_id: zed2i_left_camera_frame
    right_frame_id: zed2i_right_camera_frame
    depth_frame_id: zed2i_left_camera_frame
    image_width: 1280
    image_height: 720
    framerate: 15
    baseline_m: 0.12
    fx: 1280.0
    fy: 1280.0
    cx: 640.0
    cy: 360.0
    depth_min_m: 0.3
    depth_max_m: 20.0
    publish_pointcloud: true
    pointcloud_stride: 2
    num_disparities: 128
    block_size: 5
